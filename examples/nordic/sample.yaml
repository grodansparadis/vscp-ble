sample:
  name: VSCP BLE node (Nordic)
  description: VSCP over Bluetooth LE (E1, A2, G1) reference node for Nordic DKs
common:
  tags: bluetooth vscp
  sysbuild: true
tests:
  vscp_ble.nordic:
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf5340dk/nrf5340/cpuapp
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf52840dk/nrf52840
